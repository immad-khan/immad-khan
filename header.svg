  <!-- HUD frame -->
  <g fill="none" stroke="#00ff41" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M20 50 V26 Q20 20 26 20 H50"/>
    <path d="M1180 50 V26 Q1180 20 1174 20 H1150"/>
    <path d="M20 270 V294 Q20 300 26 300 H50"/>
    <path d="M1180 270 V294 Q1180 300 1174 300 H1150"/>
